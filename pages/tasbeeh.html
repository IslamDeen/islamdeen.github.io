<!DOCTYPE html>

<head>

  <script>

        extend: {
          colors: { 
            primary: '#0284c7', 
            'primary-light': '#e0f2fe',
            secondary: '#d97706',

            'ring': '0 0 15px rgba(2, 132, 199, 0.1)',

  <style>
    body { 
      touch-action: manipulation; 
      -webkit-tap-highlight-color: transparent; 
      overscroll-behavior-y: none; 
    }
    
    .h-dynamic { height: 100vh; height: 100dvh; }

    @keyframes subtle-pulse {
      0% { transform: scale(0.96); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 0; }
    }
    .animate-tap { animation: subtle-pulse 0.3s ease-out forwards; }
    
    .tap-area { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
    .tap-area:active { transform: scale(0.95); }
    .btn-press:active { transform: scale(0.90); }
    
    .progress-ring { transition: stroke-dashoffset 0.3s ease-out, stroke 0.3s ease; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 3px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    
    .responsive-circle {
      width: min(240px, 55vw);
      height: min(240px, 55vw);
    }

    .fade-transition { transition: opacity 0.25s ease, transform 0.25s ease; }
    .fade-out { opacity: 0; transform: translateY(4px); }
    .fade-in { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body class="bg-slate-50/80 text-slate-800 dark:bg-slate-950 dark:text-slate-200 flex flex-col h-dynamic font-bengali overflow-hidden transition-colors duration-300">

      </button>
      <button id="theme-toggle" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors btn-press focus:outline-none">

          </div>
          <span id="counter" class="text-[52px] sm:text-6xl font-semibold text-slate-700 dark:text-slate-100 tabular-nums tracking-tight leading-none">০</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Compact Bottom Menu -->

    <div class="flex justify-evenly items-center bg-white dark:bg-slate-900 rounded-[1rem] shadow-glass border border-slate-100 dark:border-slate-800/80 py-1.5 max-w-sm mx-auto">

        <span class="text-[9px] font-medium">রিসেট</span>

      <div class="w-px h-6 bg-slate-100 dark:bg-slate-800"></div>

      <button id="target-btn" class="flex-1 flex flex-col items-center py-1.5 rounded-lg text-slate-400 hover:text-primary transition-colors btn-press">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px] mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
        <span class="text-[9px] font-medium">টার্গেট</span>

    </div>

  <!-- Modals -->

    <div id="list-content" class="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-[1.5rem] shadow-[0_-5px_30px_rgba(0,0,0,0.05)] transform translate-y-full transition-transform duration-300 ease-out pointer-events-auto flex flex-col h-[75vh]">

        <h2 class="font-bold text-[14px] text-slate-800 dark:text-white">সুন্নাহ অনুযায়ী আমলের সিরিয়াল</h2>
        <button id="close-list-btn" class="p-2 -mr-2 text-slate-400 hover:text-red-500 rounded-full transition-colors btn-press">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div id="zikr-list-container" class="flex-grow overflow-y-auto custom-scrollbar p-3 space-y-2"></div>

  </div>

  <!-- Reset Confirmation Modal -->
  <div id="reset-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-200 pointer-events-none">
    <div id="modal-backdrop-reset" class="absolute inset-0 bg-slate-900/30 dark:bg-black/50 backdrop-blur-sm pointer-events-auto"></div>
    <div class="relative bg-white dark:bg-slate-900 w-[240px] rounded-[1.25rem] p-5 shadow-2xl text-center transform scale-95 transition-transform duration-200 pointer-events-auto" id="modal-content-reset">
      <div class="w-10 h-10 rounded-full bg-red-50 dark:bg-red-500/10 text-red-500 mx-auto flex items-center justify-center mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
      </div>
      <h3 class="text-[14px] font-bold text-slate-800 dark:text-white mb-1">রিসেট করবেন?</h3>
      <p class="text-slate-500 dark:text-slate-400 mb-4 text-[11px]">বর্তমান গণনা শূন্য হয়ে যাবে।</p>
      <div class="flex space-x-2">

        <button id="confirm-reset" class="flex-1 py-1.5 bg-red-500 text-white rounded-lg font-medium text-[12px] btn-press">হ্যাঁ, রিসেট</button>
      </div>
    </div>
  </div>

  <!-- Audio Element for Natural Voice -->
  <audio id="tts-audio" class="hidden" preload="auto"></audio>

  <script>
    // নামাজ শেষে ও দৈনন্দিন সুন্নাহ অনুযায়ী সম্পূর্ণ নির্ভুল আমলের ক্রম
    const zikrList = [
      { title: 'ইস্তেগফার', arabic: 'أَسْتَغْفِرُ اللَّهَ', pronunciation: 'আস্তাগফিরুল্লাহ', meaning: 'আমি আল্লাহর কাছে ক্ষমা চাই', target: 100 },
      { title: 'সুবহানাল্লাহ', arabic: 'سُبْحَانَ اللَّهِ', pronunciation: 'সুবহানাল্লাহ', meaning: 'আল্লাহ পবিত্র ও মহিমান্বিত', target: 33 },
      { title: 'আলহামদুলিল্লাহ', arabic: 'ٱلْحَمْدُ لِلَّٰهِ', pronunciation: 'আলহামদুলিল্লাহ', meaning: 'যাবতীয় প্রশংসা আল্লাহর জন্য', target: 33 },
      { title: 'আল্লাহু আকবার', arabic: 'اللَّهُ أَكْبَرُ', pronunciation: 'আল্লাহু আকবার', meaning: 'আল্লাহ সর্বশ্রেষ্ঠ', target: 34 },
      { title: 'তাওহীদের কালেমা', arabic: 'لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ', pronunciation: 'লা ইলাহা ইল্লাল্লাহু ওয়াহদাহু লা শারীকা লাহু...', meaning: 'আল্লাহ ছাড়া কোনো উপাস্য নেই, তিনি এক, তাঁর শরিক নেই', target: 100 },
      { title: 'কালেমা তাইয়্যেবা', arabic: 'لَا إِلَٰهَ إِلَّا ٱللَّٰهُ', pronunciation: 'লা ইলাহা ইল্লাল্লাহ', meaning: 'আল্লাহ ছাড়া কোনো উপাস্য নেই', target: 100 },
      { title: 'তাসবীহ ও তাহমীদ', arabic: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ', pronunciation: 'সুবহানাল্লাহি ওয়া বিহামদিহী', meaning: 'আমি আল্লাহর সপ্রশংস পবিত্রতা ঘোষণা করছি', target: 100 },
      { title: 'তাসবীহ আজিম', arabic: 'سُبْحَانَ اللَّهِ الْعَظِيمِ', pronunciation: 'সুবহানাল্লাহিল আযীম', meaning: 'মহান আল্লাহ অতি পবিত্র', target: 100 },
      { title: 'সর্বোত্তম তাসবীহ', arabic: 'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ', pronunciation: 'সুবহানাল্লাহি ওয়া বিহামদিহী, সুবহানাল্লাহিল আযীম', meaning: 'আল্লাহ পবিত্র তাঁর প্রশংসার সাথে, মহান আল্লাহ অতি পবিত্র', target: 100 },
      { title: 'হাওকালা', arabic: 'لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ', pronunciation: 'লা হাওলা ওয়ালা কুওয়্যাতা ইল্লা বিল্লাহ', meaning: 'আল্লাহর সাহায্য ছাড়া কোনো শক্তি নেই', target: 100 },
      { title: 'দরূদ শরীফ', arabic: 'صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ', pronunciation: 'সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম', meaning: 'আল্লাহ তাঁর ওপর রহমত ও শান্তি বর্ষণ করুন', target: 100 },
      { title: 'তাওয়াক্কুল', arabic: 'حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ', pronunciation: 'হাসবুনাল্লাহু ওয়া নি’মাল ওয়াকীল', meaning: 'আল্লাহই আমাদের জন্য যথেষ্ট এবং তিনি উত্তম কর্মবিধায়ক', target: 100 },
      { title: 'ইসমে আযম', arabic: 'يَا حَيُّ يَا قَيُّومُ', pronunciation: 'ইয়া হাইয়্যু ইয়া ক্বাইয়্যুম', meaning: 'হে চিরঞ্জীব, হে চিরস্থায়ী', target: 100 },
      { title: 'ক্ষমা প্রার্থনা', arabic: 'رَبِّ اغْفِرْ لِي', pronunciation: 'রাব্বিগফির লী', meaning: 'হে আমার রব, আমাকে ক্ষমা করুন', target: 100 }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const toBn = (num) => String(num).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

      let currentIndex = parseInt(localStorage.getItem('tb_idx')) || 0;
      if (currentIndex >= zikrList.length) currentIndex = 0;
      
      let counts = JSON.parse(localStorage.getItem('tb_counts')) || {};
      let targets = JSON.parse(localStorage.getItem('tb_targets')) || {};
      
      let currentZikr = zikrList[currentIndex];
      let count = counts[currentIndex] || 0;
      let target = targets[currentIndex] || currentZikr.target;
      let soundEnabled = localStorage.getItem('tb_sound') !== 'false';
      let isPlaying = false;

      const els = {
        textArea: document.getElementById('text-content-area'),
        arabic: document.getElementById('zikr-arabic'),
        pronun: document.getElementById('zikr-pronunciation'),
        meaning: document.getElementById('zikr-meaning'),
        counter: document.getElementById('counter'),
        targetTxt: document.getElementById('target-display'),
        progress: document.getElementById('progress-circle'),
        indicators: document.getElementById('slide-indicators'),
        audioPlayer: document.getElementById('tts-audio'),
        playBtn: document.getElementById('play-audio-btn'),
        playIcon: document.getElementById('play-icon'),
        pauseIcon: document.getElementById('pause-icon'),
        soundIcon: document.getElementById('sound-icon-container'),
        pulse: document.getElementById('pulse'),
        listContainer: document.getElementById('zikr-list-container')
      };

      const applyTheme = (isDark) => {
        document.documentElement.classList.toggle('dark', isDark);
        document.getElementById('theme-icon-dark').classList.toggle('hidden', !isDark);
        document.getElementById('theme-icon-light').classList.toggle('hidden', isDark);
      };
      applyTheme(localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches));

      document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = !document.documentElement.classList.contains('dark');
        applyTheme(isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });

      const updateSliderUI = () => {
        if (isPlaying) stopAudio();
        
        els.textArea.classList.remove('fade-in');
        els.textArea.classList.add('fade-out');
        
        setTimeout(() => {
          els.arabic.innerText = currentZikr.arabic;
          els.pronun.innerText = currentZikr.pronunciation;
          els.meaning.innerText = currentZikr.meaning;
          
          els.textArea.classList.remove('fade-out');
          els.textArea.classList.add('fade-in');
        }, 150);

        els.indicators.innerHTML = '';
        zikrList.forEach((_, i) => {
          const dot = document.createElement('div');
          dot.className = `h-1 rounded-full transition-all duration-300 ${i === currentIndex ? 'w-3 bg-primary' : 'w-1 bg-slate-300 dark:bg-slate-700'}`;
          els.indicators.appendChild(dot);
        });
        
        updateCounterUI(true);
      };

      const updateCounterUI = (isInitial = false) => {
        els.counter.innerText = toBn(count);
        els.targetTxt.innerText = toBn(target);
        
        const r = 92;
        const circ = 2 * Math.PI * r;
        els.progress.style.strokeDasharray = `${circ} ${circ}`;
        
        const prog = (count % target) / target;
        const isTarget = count > 0 && count % target === 0;
        
        els.progress.style.strokeDashoffset = (isTarget && !isInitial) ? 0 : circ - (prog * circ);

        if (isTarget) {
            els.progress.classList.replace('text-primary', 'text-secondary');
        } else {
            els.progress.classList.replace('text-secondary', 'text-primary');
        }

        counts[currentIndex] = count;
        targets[currentIndex] = target;
        localStorage.setItem('tb_counts', JSON.stringify(counts));
        localStorage.setItem('tb_targets', JSON.stringify(targets));
        localStorage.setItem('tb_idx', currentIndex);
      };

      const changeSlide = (newIndex) => {
        counts[currentIndex] = count; 
        currentIndex = newIndex < 0 ? zikrList.length - 1 : newIndex >= zikrList.length ? 0 : newIndex;
        currentZikr = zikrList[currentIndex];
        count = counts[currentIndex] || 0;
        target = targets[currentIndex] || currentZikr.target;
        updateSliderUI();
      };

      document.getElementById('prev-zikr-btn').addEventListener('click', () => changeSlide(currentIndex - 1));
      document.getElementById('next-zikr-btn').addEventListener('click', () => changeSlide(currentIndex + 1));

      const stopAudio = () => {
        els.audioPlayer.pause();
        els.audioPlayer.currentTime = 0;
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        isPlaying = false;
        els.playIcon.classList.remove('hidden');
        els.pauseIcon.classList.add('hidden');
      };

      els.playBtn.addEventListener('click', () => {
        if (isPlaying) {
          stopAudio();
        } else {
          isPlaying = true;
          els.playIcon.classList.add('hidden');
          els.pauseIcon.classList.remove('hidden');
          
          // Audio API URL update for better support in GitHub Pages
          const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=${encodeURIComponent(currentZikr.arabic)}`;
          els.audioPlayer.src = ttsUrl;
          
          // Smart Fallback System
          els.audioPlayer.play().catch(e => {
            // যদি গুগল অডিও ব্লক করে দেয় (যেমন গিটহাব পেজে), তাহলে স্বয়ংক্রিয়ভাবে ব্রাউজারের নিজস্ব অডিও প্লে হবে 
            if ('speechSynthesis' in window) {
              const utterance = new SpeechSynthesisUtterance(currentZikr.arabic);
              utterance.lang = 'ar-SA';
              utterance.rate = 0.8;
              utterance.onend = stopAudio;
              utterance.onerror = stopAudio;
              window.speechSynthesis.speak(utterance);
            } else {
              stopAudio();
            }
          });
        }
      });
      
      els.audioPlayer.addEventListener('ended', stopAudio);
      // Removed error listener to prevent conflict with the fallback system

      let audioCtx = null;
      
      // অডিও আনলকার
      const unlockAudioContext = () => {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
        document.removeEventListener('pointerdown', unlockAudioContext);
        document.removeEventListener('touchstart', unlockAudioContext);
      };
      document.addEventListener('pointerdown', unlockAudioContext);
      document.addEventListener('touchstart', unlockAudioContext, {passive: true});

      const playFeedback = (isTarget) => {
        // ১. ভাইব্রেশন সবসময় হবে
        if (navigator.vibrate) {
          navigator.vibrate(isTarget ? [80, 50, 80] : 45);
        }

        // ২. সাউন্ড বাটন অফ থাকলে সাউন্ড হবে না
        if (!soundEnabled) return;
        
        // ৩. সাউন্ড বাটন অন থাকলে ট্যাপ সাউন্ড হবে (ভলিউম অনেক বাড়ানো হয়েছে)
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sine';
          if(isTarget) {
             osc.frequency.setValueAtTime(500, audioCtx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
             gain.gain.setValueAtTime(0.9, audioCtx.currentTime); 
          } else {
             osc.frequency.setValueAtTime(300, audioCtx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05);
             gain.gain.setValueAtTime(0.5, audioCtx.currentTime); 
          }
          
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (isTarget ? 0.2 : 0.05));
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } catch (e) {}
      };

      document.getElementById('tap-area').addEventListener('pointerdown', (e) => {
        e.preventDefault(); 
        count++;
        playFeedback(count > 0 && count % target === 0);
        
        els.pulse.classList.remove('animate-tap');
        void els.pulse.offsetWidth; 
        els.pulse.classList.add('animate-tap');
        
        updateCounterUI();
      });

      document.getElementById('target-btn').addEventListener('click', () => {
        const tList = [33, 34, 100, 1000];
        target = tList[(tList.indexOf(target) + 1) % tList.length];
        updateCounterUI();
      });

      const updateSoundUI = () => {
        els.soundIcon.innerHTML = soundEnabled 
          ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px] text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>'
          : '<svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px] text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>';
      };
      
      // সাউন্ড বাটনে ক্লিক করলে শুধু সাউন্ড অফ/অন হবে
      document.getElementById('sound-btn').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('tb_sound', soundEnabled);
        updateSoundUI();
      });

      const setupModal = (mId, openId, closeIds, onOk) => {
        const m = document.getElementById(mId);
        const c = document.getElementById(mId === 'reset-modal' ? 'modal-content-reset' : 'list-content');
        const b = document.getElementById(mId === 'reset-modal' ? 'modal-backdrop-reset' : 'list-backdrop');

        const toggle = (show) => {
          if (show) {
            m.classList.remove('pointer-events-none', 'hidden');
            b.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => { 
                if(mId === 'reset-modal') { m.classList.remove('opacity-0'); c.classList.remove('scale-95'); }
                else c.classList.remove('translate-y-full'); 
            }, 10);
          } else {
            b.classList.add('opacity-0', 'pointer-events-none');
            if(mId === 'reset-modal') { 
              m.classList.add('opacity-0'); c.classList.add('scale-95'); 
              setTimeout(() => m.classList.add('hidden', 'pointer-events-none'), 200); 
            } else { 
              c.classList.add('translate-y-full'); 
              setTimeout(() => m.classList.add('pointer-events-none'), 300); 
            }
          }
        };

        if(openId) document.getElementById(openId).addEventListener('click', () => toggle(true));
        closeIds.forEach(id => document.getElementById(id).addEventListener('click', () => toggle(false)));
        if(onOk) document.getElementById('confirm-reset').addEventListener('click', () => { onOk(); toggle(false); });
        return toggle;
      };

      setupModal('reset-modal', 'reset-btn', ['cancel-reset', 'modal-backdrop-reset'], () => { count = 0; updateCounterUI(); });
      const toggleList = setupModal('zikr-list-modal', 'show-list-btn', ['close-list-btn', 'list-backdrop']);
      
      document.getElementById('show-list-btn').addEventListener('click', () => {
        els.listContainer.innerHTML = '';
        zikrList.forEach((z, i) => {
          const div = document.createElement('div');
          div.className = `p-2.5 rounded-xl flex justify-between items-center cursor-pointer transition-all duration-200 ${i === currentIndex ? 'bg-primary/10 border border-primary/20 shadow-sm' : 'bg-slate-50 dark:bg-slate-800/40 hover:bg-slate-100 dark:hover:bg-slate-800 border border-transparent'}`;
          div.innerHTML = `
            <div>
              <div class="font-bold text-[13px] ${i === currentIndex ? 'text-primary' : 'text-slate-700 dark:text-slate-200'}">
                <span class="text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400 px-1.5 py-0.5 rounded mr-1">${toBn(i+1)}</span>
                ${z.title}
              </div>
              <div class="text-[10px] text-slate-500 mt-1">${z.pronunciation}</div>
            </div>
            <div class="font-arabic text-xl ${i === currentIndex ? 'text-primary' : 'text-slate-600 dark:text-slate-400'}" dir="rtl">${z.arabic}</div>
          `;
          div.addEventListener('click', () => { changeSlide(i); toggleList(false); });
          els.listContainer.appendChild(div);
        });
      });

      els.textArea.classList.add('fade-in');
      updateSliderUI();
      updateSoundUI();
    });
  </script>
</body>
</html>
