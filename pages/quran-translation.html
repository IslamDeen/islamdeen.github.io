<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>আল কুরআন অনুবাদ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans Bengali (UI) & Amiri (Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- যুক্ত করা হয়েছে এক্সটার্নাল সংশোধনী ফাইল -->
    <script src="corrections.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { teal: { DEFAULT: '#1a897e', light: '#f0fdfa' } },
                    fontFamily: { bangla: ['Noto Sans Bengali', 'sans-serif'], arabic: ['Amiri', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .arabic-text { font-family: 'Amiri', serif; line-height: 1.8; }
        ::-webkit-scrollbar { display: none; }
        
        .v-card { transition: background-color 0.4s ease, border-color 0.4s ease, transform 0.3s ease; }

        .active-card {
            background-color: #f0fdfa !important;
            border-color: #5eead4 !important;
            box-shadow: 0 4px 10px rgba(45, 212, 191, 0.15) !important;
            transform: scale(1.02);
            z-index: 10;
        }

        .btn-press:active { transform: scale(0.9); }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-gray-800 pb-16">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-40 px-3 py-2.5 flex items-center gap-2.5 shadow-sm border-b border-gray-100">
        <button id="btn-back" class="hidden p-1.5 btn-press text-gray-600 bg-gray-50 rounded-full" onclick="navigateBack()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 id="header-title" class="text-[16px] font-bold text-gray-800">আল কুরআন অনুবাদ</h1>
    </header>

    <!-- Main Lists Section -->
    <main id="main-container">
        <div class="px-3 py-2 bg-white border-b border-gray-100" id="tabs-container">
            <div class="flex bg-gray-100 rounded-lg p-0.5">
                <button onclick="switchTab('home')" id="tab-home" class="flex-1 py-1.5 text-[13px] font-semibold rounded-md transition-colors text-gray-500">হোম</button>
                <button onclick="switchTab('surah')" id="tab-surah" class="flex-1 py-1.5 text-[13px] font-semibold rounded-md transition-colors bg-white text-teal shadow-sm">সূরা</button>
                <button onclick="switchTab('para')" id="tab-para" class="flex-1 py-1.5 text-[13px] font-semibold rounded-md transition-colors text-gray-500">পারা</button>
            </div>
        </div>

        <div class="px-2 py-2 hidden fade-in" id="view-home">
            <div id="history-list" class="flex flex-col gap-1.5"></div>
            <p id="empty-history" class="text-center text-[12px] text-gray-400 mt-8 hidden">কোনো হিস্ট্রি নেই</p>
        </div>

        <div class="px-2 py-2 fade-in" id="view-surah">
            <div id="surah-list" class="flex flex-col gap-1.5">
                <div class="text-center py-12 text-teal">
                    <svg class="w-6 h-6 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>
            </div>
        </div>

        <div class="px-2 py-2 hidden fade-in" id="view-para">
            <div id="para-list" class="flex flex-col gap-1.5"></div>
        </div>
    </main>

    <!-- Reader Section -->
    <main id="reader-container" class="hidden relative">
        <div class="sticky top-[45px] z-30 bg-white/95 backdrop-blur border-b border-gray-100 shadow-sm">
            <div class="flex justify-between items-center px-3 py-1.5">
                <span id="reader-revelation" class="text-[10px] font-bold text-teal bg-teal-50 px-2 py-0.5 rounded">মাক্কী</span>
                <div class="text-center">
                    <div id="reader-title" class="font-bold text-[14px] text-gray-800 leading-tight">আল ফাতিহা</div>
                    <div id="reader-subtitle" class="text-[10px] text-gray-500 mt-0.5">সূচনা</div>
                </div>
                <span id="reader-count" class="text-[10px] font-bold text-teal bg-teal-50 px-2 py-0.5 rounded">৭ আয়াত</span>
            </div>
        </div>

        <div id="verses-container" class="px-2 py-2 flex flex-col gap-1.5"></div>
        
        <div id="reader-loading" class="text-center py-10 text-teal hidden">
            <svg class="w-6 h-6 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="mt-2 text-[12px] font-medium">লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Floating Player -->
    <div id="bottom-player" class="fixed bottom-2 left-2 right-2 bg-gray-900 text-white rounded-xl px-3 py-2 shadow-2xl z-50 flex items-center justify-between transition-transform transform translate-y-[150%] duration-300">
        <div class="flex flex-col truncate pr-2">
            <span id="player-title" class="font-bold text-[13px] truncate">আল ফাতিহা</span>
            <div class="flex items-center gap-1.5 mt-0.5">
                <span id="player-subtitle" class="text-[10px] text-gray-300">আয়াত ১</span>
                <span id="player-status" class="text-[10px] text-teal-300 hidden font-medium">লোডিং...</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2.5">
            <button onclick="playPrev()" class="p-1.5 btn-press text-gray-300 active:text-white">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button id="btn-play-pause" onclick="togglePlayPause()" class="w-9 h-9 btn-press flex items-center justify-center rounded-full bg-teal-500 text-white shadow-md">
                <svg id="icon-play" class="w-4 h-4 ml-0.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" class="w-4 h-4 hidden fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="playNext(true)" class="p-1.5 btn-press text-gray-300 active:text-white">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <!-- SINGLE Audio Element -->
    <audio id="main-audio" playsinline></audio>

    <script>
        const API = 'https://api.quran.com/api/v4';
        const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        const tbn = num => num.toString().replace(/\d/g, d => bnDigits[d]);

        let state = {
            surahs: [], paras: [], tab: 'surah',
            queue: [], pIdx: -1, isPlaying: false,
            uId: null, uType: 'surah',
            audioChunks: [], chunkIdx: 0,
            isFetchingNext: false // প্রিলোডিং লক
        };

        const audioEl = document.getElementById('main-audio');
        const dom = {
            p: document.getElementById('bottom-player'),
            iPlay: document.getElementById('icon-play'), iPause: document.getElementById('icon-pause'),
            status: document.getElementById('player-status')
        };

        // --- Wake Lock (Keep screen ON) ---
        let wakeLock = null;
        let idleTimer = null;
        const IDLE_TIMEOUT = 30 * 60 * 1000;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    if (!wakeLock) wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock) wakeLock.release().then(() => { wakeLock = null; });
        }

        function resetActivityTimer() {
            requestWakeLock();
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                if (!state.isPlaying) releaseWakeLock();
            }, IDLE_TIMEOUT);
        }

        async function init() {
            setupAudioEngine();
            genParas();
            loadHist();
            await loadSurahs();
            switchTab('surah');

            document.addEventListener('touchstart', resetActivityTimer, {passive: true});
            document.addEventListener('scroll', resetActivityTimer, {passive: true});
            document.addEventListener('click', resetActivityTimer, {passive: true});

            document.addEventListener("visibilitychange", () => {
                if(document.visibilityState === 'visible') {
                    resetActivityTimer();
                    if(state.pIdx >= 0 && state.queue.length > 0) {
                        const track = state.queue[state.pIdx];
                        if(track.sId !== state.uId) {
                            updateReaderHeader(track.sId, track.type);
                            renderVerses(state.queue.filter(v => v.sId === track.sId && v.type === track.type));
                        }
                        updateUI(track, true); 
                    }
                }
            });
        }

        function switchTab(t) {
            state.tab = t;
            ['home', 'surah', 'para'].forEach(x => {
                const b = document.getElementById(`tab-${x}`);
                const v = document.getElementById(`view-${x}`);
                if (x === t) {
                    b.className = "flex-1 py-1.5 text-[13px] font-semibold rounded-md transition-colors bg-white text-teal shadow-sm";
                    v.classList.remove('hidden');
                } else {
                    b.className = "flex-1 py-1.5 text-[13px] font-semibold rounded-md transition-colors text-gray-500 bg-transparent shadow-none";
                    v.classList.add('hidden');
                }
            });
            if(t === 'home') loadHist();
        }

        function navigateBack() {
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('reader-container').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('header-title').textContent = "আল কুরআন অনুবাদ";
            if(state.tab === 'home') loadHist();
        }

        async function loadSurahs() {
            if(localStorage.getItem('qs_final')) {
                state.surahs = JSON.parse(localStorage.getItem('qs_final'));
                renderSurahs(state.surahs); return;
            }
            try {
                const res = await fetch(`${API}/chapters?language=bn`);
                state.surahs = (await res.json()).chapters;
                localStorage.setItem('qs_final', JSON.stringify(state.surahs));
                renderSurahs(state.surahs);
            } catch(e) { document.getElementById('surah-list').innerHTML = `<p class="text-red-500 text-[12px] text-center mt-4">ডেটা লোড ব্যর্থ। ইন্টারনেট চেক করুন।</p>`; }
        }

        function genParas() {
            for(let i=1; i<=30; i++) state.paras.push({ id: i, name: `পারা ${tbn(i)}` });
            renderParas(state.paras);
        }

        const badgeHTML = (num) => `<div class="w-9 h-9 rounded-full border-[1.5px] border-teal-100 flex items-center justify-center font-bold text-teal bg-teal-50 shrink-0 shadow-sm"><span class="mt-0.5 text-[12px]">${num}</span></div>`;

        function renderSurahs(surahs) {
            let h = '';
            surahs.forEach((s) => {
                h += `
                <div onclick="openRdr(${s.id}, 'surah')" class="bg-white rounded-[10px] border border-gray-100/80 p-2.5 flex items-center justify-between cursor-pointer btn-press active:bg-teal-50 transition-colors">
                    <div class="flex items-center gap-3">
                        ${badgeHTML(tbn(s.id))}
                        <div class="flex flex-col">
                            <span class="font-bold text-[14px] text-gray-800">${s.name_complex || s.name_arabic}</span>
                            <span class="text-[11px] text-gray-400 mt-0.5">${s.translated_name.name} • ${tbn(s.verses_count)} আয়াত</span>
                        </div>
                    </div>
                    <div class="text-teal text-[20px] arabic-text font-bold pr-1 opacity-90">${s.name_arabic}</div>
                </div>`;
            });
            document.getElementById('surah-list').innerHTML = h;
        }

        function renderParas(paras) {
            let h = '';
            paras.forEach((p) => {
                h += `
                <div onclick="openRdr(${p.id}, 'para')" class="bg-white rounded-[10px] border border-gray-100/80 p-3 flex items-center gap-3 cursor-pointer btn-press active:bg-teal-50 transition-colors">
                    ${badgeHTML(tbn(p.id))}
                    <span class="font-bold text-[14px] text-gray-800">${p.name}</span>
                </div>`;
            });
            document.getElementById('para-list').innerHTML = h;
        }

        function loadHist() {
            let hist = JSON.parse(localStorage.getItem('qh_final') || '[]');
            const list = document.getElementById('history-list');
            const empty = document.getElementById('empty-history');
            if(!hist.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');
            let h = '';
            hist.forEach((x) => {
                const item = x.type === 'surah' ? state.surahs.find(s => s.id === x.id) : state.paras.find(p => p.id === x.id);
                if(!item) return;
                h += `
                <div onclick="openRdr(${item.id}, '${x.type}')" class="bg-white rounded-[10px] border border-gray-100/80 p-2.5 flex items-center gap-3 cursor-pointer btn-press active:bg-teal-50 transition-colors">
                    ${badgeHTML(tbn(item.id))}
                    <div class="flex flex-col">
                        <span class="font-bold text-[14px]">${x.type === 'surah' ? (item.name_complex || item.name_arabic) : item.name}</span>
                        <span class="text-[11px] text-gray-400 mt-0.5">${x.type === 'surah' ? item.translated_name.name : 'পারা'}</span>
                    </div>
                </div>`;
            });
            list.innerHTML = h;
        }

        function saveHist(id, type) {
            let hist = JSON.parse(localStorage.getItem('qh_final') || '[]');
            hist = hist.filter(h => h.id !== id || h.type !== type);
            hist.unshift({id, type}); if(hist.length > 8) hist.pop();
            localStorage.setItem('qh_final', JSON.stringify(hist));
        }

        // Applying the Phonetic Dictionary from corrections.js
        function fixPronunciationForTTS(text) {
            let fixedText = text;
            if (typeof AUDIO_CORRECTIONS !== 'undefined') {
                for (let word in AUDIO_CORRECTIONS) {
                    let regex = new RegExp(`(^|[\\s,।?!;:"'\\-\\[\\](){}\\ঃ])(${word})(?=[\\s,।?!;:"'\\-\\[\\](){}\\ঃ]|$)`, 'g');
                    fixedText = fixedText.replace(regex, `$1${AUDIO_CORRECTIONS[word]}`);
                }
            }
            return fixedText;
        }

        // --- SMART CHUNKING LOGIC: লম্বা আয়াতকে ছোট করে ভাগ করা ---
        function chunkText(text, maxLength = 180) {
            let chunks = [];
            let words = text.split(' ');
            let current = '';
            for(let word of words) {
                if((current + ' ' + word).length < maxLength) {
                    current += (current ? ' ' : '') + word;
                } else {
                    if(current) chunks.push(current);
                    current = word;
                }
            }
            if(current) chunks.push(current);
            return chunks;
        }

        async function fetchChap(id, type) {
            const meta = type === 'surah' ? state.surahs.find(s=>s.id===id) : state.paras.find(p=>p.id===id);
            let vs = [], p = 1, tP = 1;
            const ep = type === 'surah' ? `verses/by_chapter/${id}` : `verses/by_juz/${id}`;
            while (p <= tP) {
                const res = await fetch(`${API}/${ep}?language=bn&words=false&translations=161&fields=text_uthmani&per_page=150&page=${p}`);
                if(!res.ok) break;
                const d = await res.json();
                vs = vs.concat(d.verses);
                tP = d.pagination.total_pages; p++;
            }
            return vs.map((v, idx) => ({
                id: v.id, aNum: v.verse_number, 
                tAr: v.text_uthmani, 
                tBnVisual: v.translations[0].text.replace(/<sup.*?<\/sup>/g, ''),
                tBnAudio: fixPronunciationForTTS(v.translations[0].text.replace(/<[^>]*>?/gm, '').replace(/<sup.*?<\/sup>/g, '').trim()),
                sName: type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name, 
                sId: id, type: type
            }));
        }

        function updateReaderHeader(id, type) {
            state.uId = id; state.uType = type;
            const meta = type === 'surah' ? state.surahs.find(s=>s.id===id) : state.paras.find(p=>p.id===id);
            document.getElementById('header-title').textContent = type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-title').textContent = type === 'surah' ? (meta.name_complex || meta.name_arabic) : meta.name;
            document.getElementById('reader-subtitle').textContent = type === 'surah' ? meta.translated_name.name : 'আল কুরআন অনুবাদ';
            document.getElementById('reader-revelation').textContent = type === 'surah' ? (meta.revelation_place === 'makkah' ? 'মাক্কী' : 'মাদানী') : '';
            document.getElementById('reader-count').textContent = type === 'surah' ? `${tbn(meta.verses_count)} আয়াত` : '';
            document.getElementById('reader-revelation').style.display = type === 'para' ? 'none' : 'block';
            document.getElementById('reader-count').style.display = type === 'para' ? 'none' : 'block';
        }

        async function openRdr(id, type) {
            resetActivityTimer();
            saveHist(id, type);
            
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('reader-container').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');
            updateReaderHeader(id, type);

            const con = document.getElementById('verses-container');
            const ldr = document.getElementById('reader-loading');
            con.innerHTML = ''; ldr.classList.remove('hidden');
            
            try {
                // নতুন সূরা ওপেন করলে queue একদম ক্লিয়ার করে শুধু ওই সূরাটি লোড হবে
                state.queue = await fetchChap(id, type);
                state.pIdx = -1;
                ldr.classList.add('hidden');
                
                renderVerses(state.queue.filter(v => v.sId === id && v.type === type));
                window.scrollTo(0, 0);
                
                if (state.queue.length > 0) {
                    playTrack(0);
                }
            } catch (e) {
                ldr.classList.add('hidden');
                con.innerHTML = `<div class="text-red-500 text-[12px] text-center bg-red-50 p-3 rounded mt-4">ডেটা লোড ব্যর্থ হয়েছে। ইন্টারনেট সংযোগ চেক করুন।</div>`;
            }
        }

        function renderVerses(list) {
            let h = '';
            if(list.length > 0 && list[0].type === 'surah' && list[0].sId !== 1 && list[0].sId !== 9) {
                h += `<div class="text-center mb-3 mt-3">
                        <span class="text-[16px] font-bold text-teal opacity-90">বিসমিল্লাহির রাহমানির রাহীম</span><br>
                        <span class="arabic-text text-[13px] text-teal opacity-60 mt-0.5 block">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span>
                      </div>`;
            }
            list.forEach((v) => {
                const gIdx = state.queue.indexOf(v);
                h += `
                <div id="vc-${gIdx}" onclick="playTrack(${gIdx})" class="v-card bg-white rounded-xl border border-gray-100 p-3.5 cursor-pointer relative overflow-hidden mb-1">
                    <div class="flex items-start gap-3 relative z-10">
                        <div class="w-7 h-7 rounded-full border border-teal-100 flex items-center justify-center text-[10px] font-bold text-teal bg-teal-50 shrink-0 mt-1">${tbn(v.aNum)}</div>
                        <div class="text-left flex-1">
                            <p class="text-[16px] font-semibold text-gray-800 leading-relaxed mb-2">${v.tBnVisual}</p>
                            <div class="pt-2 border-t border-gray-50 text-right">
                                <p class="arabic-text text-[15px] text-gray-500 leading-relaxed">${v.tAr}</p>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('verses-container').innerHTML = h;
        }

        // --- SMART LIGHTWEIGHT PRELOADING ---
        async function preloadNextChapterSilently() {
            if(state.isFetchingNext || state.queue.length === 0) return;
            
            const currentLastTrack = state.queue[state.queue.length - 1];
            const nextId = currentLastTrack.sId + 1;
            const limit = currentLastTrack.type === 'surah' ? 114 : 30;
            
            // যদি পরের সূরাটি অলরেডি Queue তে থাকে, তবে আর লোড করবে না
            if (state.queue.some(q => q.sId === nextId)) return;

            if (nextId <= limit) {
                state.isFetchingNext = true;
                try {
                    const nextChapData = await fetchChap(nextId, currentLastTrack.type);
                    // নিশ্চিত হওয়া যেন কোনো ডুপ্লিকেট না ঢোকে
                    const newItems = nextChapData.filter(n => !state.queue.some(q => q.id === n.id));
                    state.queue = state.queue.concat(newItems);
                } catch(e) {}
                state.isFetchingNext = false;
            }
        }

        // --- GAPLESS AUDIO ENGINE ---
        function setupAudioEngine() {
            // একটি চ্যাংক (আয়াতের অংশ) শেষ হলে
            audioEl.addEventListener('ended', () => {
                state.chunkIdx++;
                playCurrentChunk();
            });
            
            audioEl.addEventListener('error', (e) => { 
                state.isPlaying = false;
                dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden');
                dom.status.classList.remove('hidden'); dom.status.textContent = 'অডিও ত্রুটি';
            });

            audioEl.addEventListener('waiting', () => { dom.status.classList.remove('hidden'); });
            audioEl.addEventListener('playing', () => { dom.status.classList.add('hidden'); });

            audioEl.addEventListener('play', () => {
                state.isPlaying = true;
                resetActivityTimer(); 
                dom.iPlay.classList.add('hidden'); dom.iPause.classList.remove('hidden');
            });
            audioEl.addEventListener('pause', () => {
                state.isPlaying = false;
                dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden');
            });

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', togglePlayPause);
                navigator.mediaSession.setActionHandler('pause', togglePlayPause);
                navigator.mediaSession.setActionHandler('previoustrack', playPrev);
                navigator.mediaSession.setActionHandler('nexttrack', () => playNext(true));
            }
        }

        function playTrack(idx) {
            if (idx < 0 || idx >= state.queue.length) return;
            state.pIdx = idx; 
            const t = state.queue[idx];
            
            // যদি নতুন সূরায় চলে যায় (অটো নেক্সট হওয়ার সময়), তাহলে UI আপডেট করে একদম উপরে স্ক্রল করবে
            if (t.sId !== state.uId && document.visibilityState === 'visible') {
                updateReaderHeader(t.sId, t.type);
                renderVerses(state.queue.filter(v => v.sId === t.sId && v.type === t.type));
                window.scrollTo(0, 0); // নতুন সূরা শুরু হলে স্ক্রল টপে যাবে
            }

            updateUI(t, true); 

            // টেক্সটকে ছোট অংশে ভাগ করা
            state.audioChunks = chunkText(t.tBnAudio);
            state.chunkIdx = 0;
            
            playCurrentChunk();

            // প্রিলোডিং লজিক: বর্তমান সূরার শেষ ২০ আয়াতের মধ্যে চলে আসলে পরের সূরা প্রিলোড করবে
            const currentSurahVerses = state.queue.filter(v => v.sId === t.sId);
            const currentIndexInSurah = currentSurahVerses.findIndex(v => v.id === t.id);
            if (currentSurahVerses.length - currentIndexInSurah < 20) {
                preloadNextChapterSilently();
            }
        }

        function playCurrentChunk() {
            if(state.chunkIdx >= state.audioChunks.length) {
                // আয়াতের সব অংশ পড়া শেষ হলে পরের আয়াতে যাও
                playNext(false);
                return;
            }

            const ttsUrl = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=bn&q=${encodeURIComponent(state.audioChunks[state.chunkIdx])}`;
            audioEl.src = ttsUrl;
            audioEl.play().catch(e => {
                state.isPlaying = false;
                dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden');
            });
        }

        function togglePlayPause() {
            if (state.pIdx === -1 && state.queue.length > 0) return playTrack(0);
            
            if (state.isPlaying) {
                audioEl.pause();
            } else {
                audioEl.play().catch(e => console.log(e));
            }
            resetActivityTimer();
        }

        async function playNext(userTriggered) {
            if (state.pIdx + 1 < state.queue.length) {
                playTrack(state.pIdx + 1);
            } else {
                // যদি queue শেষ হয়ে যায় (মানে সূরা শেষ কিন্তু পরেরটা এখনো প্রিলোড হয়নি)
                const currentTrack = state.queue[state.pIdx];
                const limit = currentTrack.type === 'surah' ? 114 : 30;
                
                if (currentTrack.sId + 1 <= limit && !userTriggered) {
                    dom.status.classList.remove('hidden');
                    dom.status.textContent = 'পরের অধ্যায় লোড হচ্ছে...';
                    await preloadNextChapterSilently();
                    
                    if (state.pIdx + 1 < state.queue.length) {
                        playTrack(state.pIdx + 1);
                    } else {
                        stopPlaying();
                    }
                } else {
                    stopPlaying();
                }
            }
        }

        function playPrev() {
            if (state.pIdx - 1 >= 0) playTrack(state.pIdx - 1);
        }

        function stopPlaying() {
            state.isPlaying = false;
            dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden');
            dom.status.classList.add('hidden');
            releaseWakeLock();
        }

        function updateUI(t, doScroll) {
            dom.p.classList.remove('translate-y-[150%]');
            document.getElementById('player-title').textContent = t.sName;
            document.getElementById('player-subtitle').textContent = `আয়াত ${tbn(t.aNum)}`;
            dom.status.classList.add('hidden');

            document.querySelectorAll('.v-card').forEach(el => el.classList.remove('active-card'));
            
            const c = document.getElementById(`vc-${state.pIdx}`);
            if (c) {
                c.classList.add('active-card');
                
                if(doScroll && document.visibilityState === 'visible') {
                    c.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }

            if('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: `আয়াত ${tbn(t.aNum)}`, artist: t.sName });
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
