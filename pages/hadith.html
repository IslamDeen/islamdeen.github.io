<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>হাদিস শরীফ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- আপনার এক্সটার্নাল সংশোধনী ফাইল (না থাকলেও কোড চলবে) -->
    <script src="corrections.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { teal: { DEFAULT: '#1a897e', light: '#f0fdfa' } },
                    fontFamily: { bangla: ['Noto Sans Bengali', 'sans-serif'], arabic: ['Amiri', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans Bengali', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .arabic-text { font-family: 'Amiri', serif; line-height: 1.6; font-size: 1.15rem; } 
        ::-webkit-scrollbar { display: none; }
        
        .active-card {
            background-color: #f0fdfa !important;
            border-color: #5eead4 !important;
            transform: scale(1.01);
            z-index: 10;
        }
        .highlight-scroll { animation: highlightFade 2.5s ease-out forwards; }
        @keyframes highlightFade {
            0% { background-color: #ccfbf1; border-color: #14b8a6; transform: scale(1.02); }
            100% { background-color: #ffffff; border-color: #f3f4f6; transform: scale(1); }
        }

        .btn-press:active { transform: scale(0.92); }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .playing-pulse { animation: pulse-border 1.5s infinite; }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(20, 184, 166, 0); }
            100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); }
        }

        .book-icon {
            box-shadow: inset 3px 0 6px rgba(0,0,0,0.1), inset -1px 0 2px rgba(255,255,255,0.3);
            border-left: 4px solid rgba(0,0,0,0.2);
            position: relative;
        }
    </style>
</head>
<body class="text-gray-800 pb-20 text-[14px]">

    <!-- Header -->
    <header class="bg-white sticky top-0 z-40 px-3 py-2.5 flex items-center gap-3 shadow-sm border-b border-gray-100">
        <button class="p-1.5 btn-press text-gray-700 bg-gray-50 hover:bg-gray-100 rounded-full transition-colors" onclick="navigateBack()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 id="header-title" class="text-[16px] font-bold text-gray-800 tracking-tight">হাদিস</h1>
    </header>

    <!-- Global Loading Screen -->
    <div id="global-loading" class="hidden fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <svg class="w-10 h-10 animate-spin text-teal" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <p class="mt-3 text-[13px] font-bold text-teal animate-pulse">ডেটা লোড হচ্ছে...</p>
    </div>

    <!-- MAIN VIEWS -->
    <main id="view-home" class="fade-in">
        <div class="px-2 py-2 bg-white border-b border-gray-100 sticky top-[49px] z-30">
            <div class="flex bg-gray-100 rounded-lg p-0.5">
                <button onclick="switchTab('books')" id="tab-books" class="flex-1 py-1 text-[13px] font-bold rounded-md transition-colors bg-white text-teal shadow-sm">গ্রন্থসমূহ</button>
                <button onclick="switchTab('bookmarks')" id="tab-bookmarks" class="flex-1 py-1 text-[13px] font-bold rounded-md transition-colors text-gray-500">বুকমার্ক</button>
            </div>
        </div>
        <div id="tab-content-books" class="px-2 py-2 flex flex-col gap-2">
            <div id="last-read-container" class="hidden mb-1"></div>
            <div id="books-list-container" class="flex flex-col gap-2"></div>
        </div>
        <div id="tab-content-bookmarks" class="hidden px-2 py-2 flex flex-col gap-2">
            <div id="bookmarks-list-container" class="flex flex-col gap-2"></div>
        </div>
    </main>

    <main id="view-chapters" class="hidden px-2 py-2 fade-in flex flex-col gap-2"></main>
    <main id="view-hadiths" class="hidden fade-in relative px-2 py-2 flex flex-col gap-2"></main>

    <!-- Floating Audio Player -->
    <div id="bottom-player" class="fixed bottom-2 left-2 right-2 bg-gray-900 text-white rounded-[14px] px-3 py-2 shadow-2xl z-50 flex items-center justify-between transition-transform transform translate-y-[150%] duration-300">
        <div class="flex flex-col truncate pr-2 w-[65%]">
            <span id="player-title" class="font-bold text-[13px] truncate text-teal-50">অধ্যায়</span>
            <div class="flex items-center gap-1.5 mt-0.5">
                <span id="player-subtitle" class="text-[10px] text-gray-400">হাদিস ১</span>
                <span id="player-status" class="text-[9px] text-teal-400 hidden font-medium bg-teal-900/50 px-1.5 rounded">লোডিং...</span>
            </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button onclick="playPrev()" class="p-1.5 btn-press text-gray-300 active:text-white">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button onclick="togglePlayPause()" class="w-9 h-9 btn-press flex items-center justify-center rounded-full bg-teal-500 text-white shadow-lg border border-teal-400/30">
                <svg id="icon-play" class="w-4 h-4 ml-0.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" class="w-4 h-4 hidden fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="playNext(true)" class="p-1.5 btn-press text-gray-300 active:text-white">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <audio id="main-audio" playsinline></audio>

    <script>
        const API_BASE = 'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions';
        const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        const tbn = num => num ? num.toString().replace(/\d/g, d => bnDigits[d]) : '০';

        const booksList = [
            { id: 'bukhari', name: 'সহিহ বুখারী', total: 7563, bg: 'bg-[#509c95]' },
            { id: 'muslim', name: 'সহিহ মুসলিম', total: 7453, bg: 'bg-[#a34444]' },
            { id: 'nasai', name: 'সুনানে আন-নাসায়ী', total: 5758, bg: 'bg-[#4a6baf]' },
            { id: 'abudawud', name: 'সুনানে আবু দাউদ', total: 5274, bg: 'bg-[#2998a4]' },
            { id: 'tirmidhi', name: 'জামে আত-তিরমিজি', total: 3956, bg: 'bg-[#8d5440]' },
            { id: 'ibnmajah', name: 'সুনানে ইবনে মাজাহ', total: 4341, bg: 'bg-[#704899]' },
            { id: 'malik', name: 'মুয়াত্তা ইমাম মালিক', total: 1832, bg: 'bg-[#408a94]' }
        ];

        let state = {
            view: 'home', tab: 'books',
            bookId: null, bookName: '', bookData: [], chapters: [], activeChapterId: null, activeChapterName: '',
            bookmarks: JSON.parse(localStorage.getItem('h_bookmarks') || '[]'),
            lastRead: JSON.parse(localStorage.getItem('h_last_read') || 'null'), 
            queue: [], pIdx: -1, isPlaying: false, audioChunks: [], chunkIdx: 0,
            playContext: 'chapter'
        };

        const audioEl = document.getElementById('main-audio');
        const dom = {
            p: document.getElementById('bottom-player'),
            iPlay: document.getElementById('icon-play'), iPause: document.getElementById('icon-pause'),
            status: document.getElementById('player-status'),
            loader: document.getElementById('global-loading'),
            title: document.getElementById('header-title')
        };

        let scrollObserver = null;

        function init() {
            renderBooks();
            renderLastRead();
            renderBookmarks();
            setupAudioEngine();
            document.addEventListener("visibilitychange", () => {
                if (document.hidden && state.isPlaying) audioEl.pause();
            });
        }

        // --- Back Navigation (Safe) ---
        function navigateBack() {
            if (state.view === 'hadiths') {
                if(state.playContext === 'bookmarks') switchView('home', 'হাদিস');
                else { switchView('chapters', state.bookName); window.scrollTo(0, 0); }
            } else if (state.view === 'chapters') {
                switchView('home', 'হাদিস');
                state.bookData = []; // মেমরি ক্লিন
                renderLastRead(); 
            } else {
                if (document.referrer) window.history.back();
                else alert("আপনি মূল ওয়েবসাইটে ফিরে যাচ্ছেন...");
            }
        }

        function switchView(viewName, title) {
            state.view = viewName; dom.title.textContent = title;
            ['home', 'chapters', 'hadiths'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
        }

        function switchTab(tabName) {
            state.tab = tabName;
            ['books', 'bookmarks'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const content = document.getElementById(`tab-content-${t}`);
                if (t === tabName) {
                    btn.className = "flex-1 py-1 text-[13px] font-bold rounded-md transition-colors bg-white text-teal shadow-sm";
                    content.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-1 text-[13px] font-bold rounded-md transition-colors text-gray-500 bg-transparent shadow-none";
                    content.classList.add('hidden');
                }
            });
            if(tabName === 'bookmarks') renderBookmarks();
        }

        // --- 1. Home ---
        function renderBooks() {
            const container = document.getElementById('books-list-container');
            container.innerHTML = booksList.map((b, idx) => `
                <div onclick="fetchBookData('${b.id}')" class="bg-white rounded-xl p-2.5 flex items-center gap-3 cursor-pointer shadow-sm border border-gray-100 btn-press active:bg-gray-50">
                    <div class="${b.bg} w-[42px] h-[56px] rounded-sm book-icon flex items-center justify-center p-0.5 shrink-0">
                        <div class="border border-white/20 w-full h-full rounded-sm flex items-center justify-center">
                             <span class="text-white text-[8px] font-bold text-center leading-tight opacity-90">${b.name}</span>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <h3 class="font-bold text-[14px] text-gray-800">${b.name}</h3>
                        <p class="text-[11px] text-gray-500 mt-0.5">${tbn(b.total)} হাদিস</p>
                    </div>
                </div>
            `).join('');
        }

        function renderLastRead() {
            const container = document.getElementById('last-read-container');
            if (!state.lastRead) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            const lr = state.lastRead;
            container.innerHTML = `
                <div onclick="resumeLastRead()" class="bg-teal-50/50 rounded-xl p-3 cursor-pointer border border-teal-100 btn-press flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold text-teal-600 mb-0.5 flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> সর্বশেষ পঠিত
                        </span>
                        <h3 class="font-bold text-[14px] text-gray-800">${lr.bName}</h3>
                        <p class="text-[12px] text-gray-600 truncate w-[200px]">${lr.chName} (হাদিস: ${tbn(lr.hNum)})</p>
                    </div>
                    <svg class="w-5 h-5 text-teal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            `;
        }

        // --- 2. Direct API Data Fetching (Optimized & Clean) ---
        async function fetchBookData(id, targetChId = null, targetHIdx = null) {
            dom.loader.classList.remove('hidden');
            const book = booksList.find(b => b.id === id);
            state.bookId = id; state.bookName = book.name;

            try {
                const [resAr, resBn] = await Promise.all([
                    fetch(`${API_BASE}/ara-${id}.min.json`),
                    fetch(`${API_BASE}/ben-${id}.min.json`)
                ]);

                if (!resAr.ok || !resBn.ok) throw new Error("API Error");

                const dataAr = await resAr.json();
                const dataBn = await resBn.json();

                // Extract Chapters properly from metadata or fallback safely
                const sectionsObj = dataBn.metadata?.section || dataBn.metadata?.sections || {};
                const detailsObj = dataBn.metadata?.section_details || {};
                
                let chapters = [];
                for (let key in sectionsObj) {
                    if (sectionsObj[key] && String(sectionsObj[key]).trim() !== "") {
                        let first = detailsObj[key]?.hadithnumber_first;
                        let last = detailsObj[key]?.hadithnumber_last;
                        let range = (first && last) ? `${tbn(first)} - ${tbn(last)}` : '';
                        
                        chapters.push({ id: key, name: sectionsObj[key], range, first, last });
                    }
                }
                
                // Fallback for empty metadata
                if(chapters.length === 0) chapters.push({ id: '1', name: 'সকল হাদিস', range: '', first: 1, last: 999999 });

                state.chapters = chapters;

                // Merge Arabic directly
                let araMap = new Map();
                dataAr.hadiths.forEach(h => araMap.set(h.hadithnumber, h.text));
                dataBn.hadiths.forEach(h => { h.arabic_text = araMap.get(h.hadithnumber) || ""; });

                state.bookData = dataBn.hadiths;

                if (targetChId !== null) openChapter(targetChId, targetHIdx);
                else {
                    renderChapters();
                    switchView('chapters', state.bookName);
                    window.scrollTo(0, 0);
                }
            } catch (err) {
                alert("ডাটা লোড করতে সমস্যা হয়েছে। ইন্টারনেট চেক করুন।");
            } finally {
                dom.loader.classList.add('hidden');
            }
        }

        async function resumeLastRead() {
            if(state.lastRead) await fetchBookData(state.lastRead.bId, state.lastRead.chId, state.lastRead.hIdx);
        }

        // --- 3. Chapters ---
        function renderChapters() {
            const container = document.getElementById('view-chapters');
            const starIcon = `<svg class="w-8 h-8 text-teal-100 fill-teal-50 shrink-0" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2l2.4 4.8 5.2.8-3.8 3.7.9 5.2-4.7-2.5-4.7 2.5.9-5.2-3.8-3.7 5.2-.8L12 2z"></path></svg>`;

            container.innerHTML = state.chapters.map(ch => `
                <div onclick="openChapter('${ch.id}')" class="bg-white rounded-xl p-2.5 flex items-center justify-between cursor-pointer btn-press shadow-sm border border-gray-100">
                    <div class="flex items-center gap-2">
                        <div class="relative w-8 h-8 flex items-center justify-center">
                            ${starIcon}
                            <span class="absolute text-[11px] font-bold text-teal-600">${tbn(ch.id)}</span>
                        </div>
                        <h4 class="font-bold text-[13px] text-gray-800 leading-snug w-[180px] truncate">${ch.name}</h4>
                    </div>
                    <span class="text-[10px] text-gray-400 bg-gray-50 px-1.5 py-0.5 rounded">${ch.range}</span>
                </div>
            `).join('');
        }

        // --- 4. Hadiths & Auto-Save ---
        function openChapter(chId, scrollTargetIdx = null) {
            const chapter = state.chapters.find(c => c.id == chId);
            if(!chapter) return;
            
            state.activeChapterId = chId; 
            state.activeChapterName = chapter.name; 
            state.playContext = 'chapter';
            
            const chapterHadiths = state.bookData.filter(h => {
                if (h.reference && h.reference.book == chId) return true;
                if (chapter.first && chapter.last) return h.hadithnumber >= chapter.first && h.hadithnumber <= chapter.last;
                return false;
            });
            
            state.queue = chapterHadiths.map(h => ({
                hId: h.hadithnumber, aNum: h.hadithnumber, tAr: h.arabic_text,
                tBnVisual: h.text, tBnAudio: fixTTS(h.text.replace(/<[^>]*>?/gm, '').trim()), 
                sName: chapter.name, bId: state.bookId, bName: state.bookName
            }));

            state.pIdx = -1;
            buildHadithCards(state.queue);
            switchView('hadiths', chapter.name);
            setupScrollObserver(); 

            if (scrollTargetIdx !== null && scrollTargetIdx < state.queue.length) {
                setTimeout(() => {
                    const el = document.getElementById(`vc-${scrollTargetIdx}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.classList.add('highlight-scroll');
                        setTimeout(() => el.classList.remove('highlight-scroll'), 2500);
                    }
                }, 300);
            } else window.scrollTo(0, 0);
        }

        function setupScrollObserver() {
            if (scrollObserver) scrollObserver.disconnect();
            scrollObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && state.playContext === 'chapter' && !state.isPlaying) {
                        autoSaveLastRead(parseInt(entry.target.dataset.idx));
                    }
                });
            }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });

            document.querySelectorAll('.hadith-card').forEach(card => scrollObserver.observe(card));
        }

        function autoSaveLastRead(idx) {
            const h = state.queue[idx];
            if(!h) return;
            state.lastRead = { bId: h.bId, bName: h.bName, chId: state.activeChapterId, chName: state.activeChapterName, hIdx: idx, hNum: h.aNum };
            localStorage.setItem('h_last_read', JSON.stringify(state.lastRead));
        }

        function buildHadithCards(list) {
            const container = document.getElementById('view-hadiths');
            if(list.length === 0) { container.innerHTML = `<div class="text-center text-gray-500 mt-10 text-[13px]">এই অধ্যায়ে কোনো হাদিস পাওয়া যায়নি।</div>`; return; }

            container.innerHTML = list.map((h, idx) => {
                const isSaved = state.bookmarks.some(b => b.bId === h.bId && b.hId === h.hId);
                const heartSvg = isSaved ? `<svg class="w-4 h-4 text-red-500 fill-current" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>` 
                                         : `<svg class="w-4 h-4 text-gray-400 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>`;

                return `
                <div id="vc-${idx}" data-idx="${idx}" class="hadith-card bg-white rounded-xl border border-gray-100 p-3 shadow-sm transition-colors duration-300">
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-50">
                        <div class="flex items-center gap-2">
                            <span class="bg-teal-50 text-teal-700 font-bold text-[11px] px-2 py-0.5 rounded border border-teal-100/50">হাদিস: ${tbn(h.aNum)}</span>
                            ${state.playContext === 'bookmarks' ? `<span class="text-[9px] text-gray-400 font-bold">${h.bName}</span>` : ''}
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="toggleBookmark(${idx})" id="bmk-btn-${idx}" class="p-1.5 rounded-full hover:bg-red-50 btn-press">
                                ${heartSvg}
                            </button>
                            <button onclick="toggleCardPlay(${idx})" id="card-play-btn-${idx}" class="text-teal-500 p-1.5 rounded-full hover:bg-teal-50 btn-press card-play-btn">
                                <svg class="w-4 h-4 fill-current icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                <svg class="w-4 h-4 fill-current icon-pause hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                            </button>
                        </div>
                    </div>
                    <p class="text-[14px] text-gray-800 leading-relaxed font-bangla font-medium mb-3">${h.tBnVisual}</p>
                    ${h.tAr ? `<p class="arabic-text text-right text-gray-500 pt-2 border-t border-gray-50">${h.tAr}</p>` : ''}
                </div>
            `}).join('');
        }

        // --- 5. Bookmarks ---
        function toggleBookmark(idx) {
            const h = state.queue[idx];
            const bIndex = state.bookmarks.findIndex(b => b.bId === h.bId && b.hId === h.hId);
            const btn = document.getElementById(`bmk-btn-${idx}`);
            
            if (bIndex > -1) {
                state.bookmarks.splice(bIndex, 1);
                if(btn) btn.innerHTML = `<svg class="w-4 h-4 text-gray-400 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>`;
            } else {
                state.bookmarks.push({ bId: h.bId, bName: h.bName, hId: h.hId, tBn: h.tBnVisual, tAr: h.tAr, chName: h.sName });
                if(btn) btn.innerHTML = `<svg class="w-4 h-4 text-red-500 fill-current" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>`;
            }
            localStorage.setItem('h_bookmarks', JSON.stringify(state.bookmarks));
            if (state.playContext === 'bookmarks' && bIndex > -1) openBookmarksViewer(); 
        }

        function renderBookmarks() {
            const container = document.getElementById('bookmarks-list-container');
            if (state.bookmarks.length === 0) {
                container.innerHTML = `<div class="text-center py-10"><p class="text-gray-400 font-medium text-[12px]">কোনো হাদিস সেভ করা নেই।</p></div>`;
                return;
            }
            container.innerHTML = `
                <div onclick="openBookmarksViewer()" class="bg-red-50/50 rounded-xl p-3 cursor-pointer border border-red-100 btn-press flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-red-100 text-red-500 rounded-full flex items-center justify-center font-bold text-[12px]">${tbn(state.bookmarks.length)}</div>
                        <span class="font-bold text-[13px] text-gray-800">সংরক্ষিত হাদিসসমূহ</span>
                    </div>
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </div>
            `;
        }

        function openBookmarksViewer() {
            state.playContext = 'bookmarks';
            state.queue = state.bookmarks.map(h => ({
                hId: h.hId, aNum: h.hId, tAr: h.tAr,
                tBnVisual: h.tBn, tBnAudio: fixTTS(h.tBn.replace(/<[^>]*>?/gm, '').trim()), 
                sName: h.chName || 'সংরক্ষিত', bId: h.bId, bName: h.bName
            }));
            state.pIdx = -1;
            buildHadithCards(state.queue);
            switchView('hadiths', 'বুকমার্ককৃত হাদিস');
            window.scrollTo(0, 0);
        }

        // --- Audio Engine ---
        function fixTTS(text) {
            let fixed = text;
            if (typeof AUDIO_CORRECTIONS !== 'undefined') {
                for (let word in AUDIO_CORRECTIONS) {
                    let regex = new RegExp(`(^|[\\s,।?!;:"'\\-\\[\\](){}\\ঃ])(${word})(?=[\\s,।?!;:"'\\-\\[\\](){}\\ঃ]|$)`, 'g');
                    fixed = fixed.replace(regex, `$1${AUDIO_CORRECTIONS[word]}`);
                }
            }
            return fixed;
        }

        function chunkText(text, maxLength = 180) {
            let chunks = [], words = text.split(' '), current = '';
            for(let word of words) {
                if((current + ' ' + word).length < maxLength) current += (current ? ' ' : '') + word;
                else { if(current) chunks.push(current); current = word; }
            }
            if(current) chunks.push(current); return chunks;
        }

        function setupAudioEngine() {
            audioEl.addEventListener('ended', () => { state.chunkIdx++; playCurrentChunk(); });
            audioEl.addEventListener('error', () => { 
                state.isPlaying = false; 
                dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden'); 
                dom.status.classList.remove('hidden'); dom.status.textContent = 'ত্রুটি'; 
                syncCardPlayButtons(false);
            });
            audioEl.addEventListener('waiting', () => { dom.status.classList.remove('hidden'); });
            audioEl.addEventListener('playing', () => { dom.status.classList.add('hidden'); });
            audioEl.addEventListener('play', () => { 
                state.isPlaying = true; 
                dom.iPlay.classList.add('hidden'); dom.iPause.classList.remove('hidden'); 
                syncCardPlayButtons(true);
            });
            audioEl.addEventListener('pause', () => { 
                state.isPlaying = false; 
                dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden'); 
                syncCardPlayButtons(false);
            });
        }

        function playTrack(idx) {
            if (idx < 0 || idx >= state.queue.length) return;
            state.pIdx = idx; const t = state.queue[idx]; 
            
            autoSaveLastRead(idx); 

            updateUI(t, true); 
            state.audioChunks = chunkText(t.tBnAudio); 
            state.chunkIdx = 0; 
            playCurrentChunk();
        }

        function toggleCardPlay(idx) {
            if (state.pIdx === idx && state.isPlaying) audioEl.pause(); 
            else playTrack(idx);
        }

        function togglePlayPause() {
            if (state.pIdx === -1 && state.queue.length > 0) return playTrack(0);
            state.isPlaying ? audioEl.pause() : audioEl.play();
        }

        function playCurrentChunk() {
            if(state.chunkIdx >= state.audioChunks.length) { playNext(false); return; }
            const ttsUrl = `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=bn&q=${encodeURIComponent(state.audioChunks[state.chunkIdx])}`;
            audioEl.src = ttsUrl; 
            audioEl.play().catch(e => { state.isPlaying = false; syncCardPlayButtons(false); });
        }

        function playNext(userTriggered) {
            if (state.pIdx + 1 < state.queue.length) { 
                playTrack(state.pIdx + 1); 
            } else if (!userTriggered && state.playContext === 'chapter') {
                const nextChId = parseInt(state.activeChapterId) + 1;
                const nextCh = state.chapters.find(c => c.id == nextChId);
                if (nextCh) {
                    dom.status.classList.remove('hidden'); dom.status.textContent = 'পরের অধ্যায়...';
                    openChapter(nextCh.id); 
                    setTimeout(() => playTrack(0), 1000); 
                } else stopPlaying();
            } else stopPlaying();
        }

        function playPrev() { if (state.pIdx - 1 >= 0) playTrack(state.pIdx - 1); }
        
        function stopPlaying() { 
            state.isPlaying = false; 
            dom.iPlay.classList.remove('hidden'); dom.iPause.classList.add('hidden'); 
            dom.status.classList.add('hidden'); 
            syncCardPlayButtons(false);
        }

        function updateUI(t, doScroll) {
            dom.p.classList.remove('translate-y-[150%]');
            document.getElementById('player-title').textContent = state.playContext === 'bookmarks' ? t.bName : t.sName;
            document.getElementById('player-subtitle').textContent = `হাদিস ${tbn(t.aNum)}`;
            dom.status.classList.add('hidden');
            
            document.querySelectorAll('.hadith-card').forEach(el => el.classList.remove('active-card'));
            const activeCard = document.getElementById(`vc-${state.pIdx}`);
            if (activeCard) { 
                activeCard.classList.add('active-card'); 
                if (doScroll) activeCard.scrollIntoView({ behavior: "smooth", block: "center" }); 
            }
            if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: `হাদিস ${tbn(t.aNum)}`, artist: state.playContext === 'bookmarks' ? 'বুকমার্ক' : state.bookName });
        }

        function syncCardPlayButtons(isPlaying) {
            document.querySelectorAll('.card-play-btn').forEach(btn => {
                btn.classList.remove('playing-pulse');
                btn.querySelector('.icon-play').classList.remove('hidden');
                btn.querySelector('.icon-pause').classList.add('hidden');
            });

            if (state.pIdx !== -1) {
                const activeBtn = document.getElementById(`card-play-btn-${state.pIdx}`);
                if (activeBtn) {
                    if (isPlaying) {
                        activeBtn.classList.add('playing-pulse');
                        activeBtn.querySelector('.icon-play').classList.add('hidden');
                        activeBtn.querySelector('.icon-pause').classList.remove('hidden');
                    }
                }
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
