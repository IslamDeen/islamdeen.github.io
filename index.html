<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title id="appTitle"></title>

    <!-- DESKTOP AUTO-REDIRECT SYSTEM -->
    <!-- আপনি যখন ডেক্সটপের জন্য 'desktop.html' ফাইল আপলোড করবেন, ডেক্সটপ ইউজাররা অটোমেটিক সেখানে চলে যাবে -->
    <script>
        (function() {
            var isDesktop = window.innerWidth >= 1024 && !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isDesktop) {
                fetch('desktop.html', { method: 'HEAD', cache: 'no-store' })
                    .then(function(res) {
                        if (res.ok) window.location.replace('desktop.html');
                    })
                    .catch(function() {});
            }
        })();
    </script>
    
    <!-- Real PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bangla Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Hind Siliguri"', 'sans-serif'] },
                    colors: { appGreen: '#1b6b5c', appGreenLight: '#238968' }
                }
            }
        }
    </script>

    <!-- CRITICAL ANTI-FLUTTER CSS (Tailwind লোড হওয়ার আগেই লেআউট স্থির রাখবে) -->
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        
        body { 
            background-color: #f8fafc; 
            margin: 0; 
            padding: 0;
            min-height: 100vh; 
            min-height: 100dvh;
            overflow-x: hidden; 
            font-family: 'Hind Siliguri', sans-serif;
            color: #1e293b;
        }
        
        /* Pure Mobile Container */
        #app-container { 
            width: 100%; 
            max-width: 480px; 
            margin: 0 auto;
            background-color: #f8fafc; 
            min-height: 100vh; 
            min-height: 100dvh;
            position: relative; 
            display: flex; 
            flex-direction: column;
        }

        /* Fixed Header & Logo Slot - রিলোড দিলে ১ পিক্সেলও নড়বে না */
        #mainHeader {
            height: 48px;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e2e8f0;
        }
        #brandArea {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 26px;
        }
        #logoSlot {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #appLogo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        #appNameHeader {
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            color: #1e293b;
            margin: 0;
            white-space: nowrap;
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        .icon-box { 
            width: 40px; 
            height: 40px; 
            background: #ffffff; 
            border-radius: 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: transform 0.15s ease, background-color 0.15s ease; 
            border: 1px solid #e2e8f0; 
            color: #475569; 
            font-size: 15px;
            overflow: hidden;
        }
        .cat-item:active .icon-box { transform: scale(0.93); background: #e2e8f0; color: #0f172a; }
        
        #extraCategories { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.25s ease-in-out; }
        a, button { -webkit-user-drag: none; outline: none; }
    </style>
</head>
<body class="antialiased">

    <div id="app-container">

        <!-- HEADER (Zero Layout Shift / Zero Flutter) -->
        <header id="mainHeader">
            <div id="brandArea">
                <div id="logoSlot">
                    <img id="appLogo" src="logo.png" alt="" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
                </div>
                <h1 id="appNameHeader"></h1>
            </div>
            
            <div class="flex items-center gap-1.5">
                <button id="installBtn" class="hidden items-center gap-1 bg-green-50 text-appGreen font-bold text-[10px] px-2.5 py-1 rounded border border-green-100 active:scale-95 transition">
                    <i class="fa-solid fa-download text-[10px]"></i> ইন্সটল
                </button>
                <button onclick="window.location.reload()" class="w-8 h-8 flex justify-center items-center text-slate-400 active:scale-90 transition rounded-full">
                    <i class="fa-solid fa-rotate-right text-[13px]"></i>
                </button>
                <a href="about.html" class="w-8 h-8 flex justify-center items-center text-slate-400 active:scale-90 transition rounded-full">
                    <i class="fa-solid fa-bars text-[14px]"></i>
                </a>
            </div>
        </header>

        <!-- রিলোড দেওয়ার সাথে সাথে ০ মিলিসেকেন্ডে নাম বসিয়ে দেওয়ার ইনস্ট্যান্ট স্ক্রিপ্ট -->
        <script>
            (function() {
                try {
                    var cached = JSON.parse(localStorage.getItem('dynamic_app_config'));
                    if (cached && cached.appName) {
                        document.getElementById('appNameHeader').textContent = cached.appName;
                        document.getElementById('appTitle').textContent = cached.appName;
                    }
                } catch (e) {}
            })();
        </script>

        <main class="px-3 mt-2.5 space-y-3 pb-3 flex-1">
            <!-- PRAYER BANNER -->
            <section class="relative z-30 rounded-xl shadow-sm bg-gradient-to-r from-appGreen to-appGreenLight px-3.5 py-2.5 flex justify-between items-center">
                <div class="absolute inset-0 overflow-hidden rounded-xl pointer-events-none">
                    <i class="fa-solid fa-mosque absolute -bottom-3 -right-2 text-[65px] text-white/10 -rotate-6"></i>
                </div>
                
                <div class="flex flex-col flex-1 relative z-10">
                    <span class="text-[9px] text-green-100 font-medium tracking-wide">পরবর্তী নামাজ:</span>
                    <div class="flex items-baseline gap-1 flex-wrap">
                        <span id="nextPrayerName" class="text-[17px] font-bold text-white leading-none">--</span>
                        <span id="nextPrayerTime" class="text-[11px] font-mono text-green-200 ml-1">--:--</span>
                    </div>
                    <div class="text-[10px] font-medium text-green-100 mt-0.5 flex items-center gap-1">
                        <i class="fa-regular fa-clock text-[9px]"></i>
                        <span>বাকি: <span id="countdown" class="font-mono font-bold text-yellow-300 text-[11px] ml-0.5">--:--:--</span></span>
                    </div>
                </div>
                
                <div class="flex flex-col items-end gap-1.5 shrink-0 relative z-10">
                    <div class="relative">
                        <button id="locBtn" onclick="toggleLocDropdown(event)" class="flex items-center gap-1 text-[10px] font-semibold text-white bg-white/15 px-2.5 py-1 rounded transition border border-white/20 min-w-[70px] justify-between">
                            <i class="fa-solid fa-location-dot text-[8px] text-green-200 pointer-events-none"></i>
                            <span id="selectedLocText" class="truncate max-w-[55px] pointer-events-none">Dhaka</span>
                            <i class="fa-solid fa-chevron-down text-[7px] text-green-100 pointer-events-none"></i>
                        </button>
                        <div id="locDropdown" class="hidden absolute right-0 top-[110%] w-44 bg-white shadow-xl border border-gray-200 rounded-lg p-1.5 z-[100]">
                            <input type="text" id="locSearch" onclick="event.stopPropagation()" onkeyup="filterLocations()" placeholder="জেলা খুঁজুন..." class="w-full bg-slate-50 border border-slate-200 text-[11px] px-2.5 py-1.5 rounded outline-none focus:border-appGreen mb-1 text-slate-700">
                            <ul id="locList" class="max-h-36 overflow-y-auto"></ul>
                        </div>
                    </div>
                    <button onclick="toggleNoti()" class="flex items-center gap-1 text-[9px] font-medium text-white bg-white/10 px-2.5 py-1 rounded active:scale-95 transition border border-white/10">
                        <i id="notiIcon" class="fa-regular fa-bell text-[9px]"></i> <span id="notiText">অ্যালার্ম</span>
                    </button>
                </div>
            </section>

            <!-- CATEGORY GRID (MOBILE 4-COLUMN DYNAMIC) -->
            <section class="bg-white border border-slate-100 rounded-xl p-3 shadow-sm z-10 relative">
                <div id="mainCategoriesGrid" class="grid grid-cols-4 gap-y-3 gap-x-2"></div>

                <div id="extraCategories">
                    <div id="extraCategoriesGrid" class="grid grid-cols-4 gap-y-3 gap-x-2 pt-3"></div>
                </div>

                <div class="mt-2.5 justify-center hidden" id="toggleButtonContainer">
                    <button onclick="toggleCategories()" class="text-[10px] text-slate-400 font-semibold flex items-center gap-1.5 active:scale-95 transition bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                        <span id="toggleText">আরও দেখুন</span> <i id="toggleIcon" class="fa-solid fa-chevron-down text-[8px] transition-transform duration-200"></i>
                    </button>
                </div>
            </section>

            <!-- MODERN AUDIO PLAYER (DYNAMIC) -->
            <section id="audioPlayerSection" class="hidden bg-white border border-slate-100 rounded-[14px] shadow-sm z-10 relative overflow-hidden flex-col">
                <div class="flex items-center w-full">
                    <a id="audioLink" href="#" class="flex items-center gap-2.5 py-2.5 px-3 cursor-pointer active:bg-slate-100 transition-colors w-1/2">
                        <div id="audioIconContainer" class="w-9 h-9 bg-slate-50 border border-slate-100 rounded-full flex justify-center items-center text-appGreen shrink-0 overflow-hidden"></div>
                        <div class="flex flex-col truncate">
                            <span id="audioTitle" class="text-[12px] font-bold text-slate-800 leading-tight truncate"></span>
                            <span id="audioSubtitle" class="text-[9.5px] font-medium text-slate-500 mt-0.5 truncate"></span>
                        </div>
                    </a>
                    
                    <div class="flex items-center justify-end gap-1.5 pr-3 py-2.5 w-1/2">
                        <button onclick="skipPlayerAudio(-5)" class="w-8 h-8 flex justify-center items-center text-slate-400 rounded-full active:scale-90 transition">
                            <i class="fa-solid fa-backward-step text-[11px]"></i>
                        </button>
                        
                        <button onclick="togglePlayerAudio()" class="w-10 h-10 bg-slate-800 text-white rounded-full flex justify-center items-center shadow-md active:scale-90 transition">
                            <i id="playerPlayIcon" class="fa-solid fa-play text-[12px] ml-0.5"></i>
                        </button>
                        
                        <button onclick="skipPlayerAudio(5)" class="w-8 h-8 flex justify-center items-center text-slate-400 rounded-full active:scale-90 transition">
                            <i class="fa-solid fa-forward-step text-[11px]"></i>
                        </button>
                    </div>
                </div>
                
                <div class="w-full bg-slate-100 h-1">
                    <div id="playerProgressBar" class="bg-slate-800 h-full w-0 transition-all duration-300 rounded-r-full"></div>
                </div>
                <audio id="asmaulAudioPlayer" preload="none"></audio> 
            </section>

            <!-- DYNAMIC CONTENT FEED (MOBILE STACK) -->
            <section id="dynamicFeed" class="flex flex-col gap-3 z-10 relative"></section>

            <!-- ULTRA MINIMAL FOOTER -->
            <footer id="minimalFooter" class="flex justify-center items-center gap-3 pt-3 pb-2 w-full text-[9px] font-medium text-slate-400 z-10 relative"></footer>
        </main>

        <!-- PRAYER MODAL -->
        <div id="prayerModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm px-4" onclick="if(event.target === this) closePrayerModal()">
            <div id="prayerModalContent" class="bg-white rounded-xl p-3.5 w-full max-w-[250px] shadow-xl transform scale-95 transition-transform duration-200 relative">
                <div class="text-center mb-2.5 pb-2.5 border-b border-slate-100">
                    <h2 class="text-[13px] font-bold text-appGreen flex justify-center items-center gap-1.5"><i class="fa-solid fa-clock text-[11px]"></i> আজকের সময়সূচী</h2>
                </div>
                <div id="modalPrayerList" class="flex flex-col gap-2">
                    <div class="text-center text-slate-400 text-[11px] py-2.5"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</div>
                </div>
                <button onclick="closePrayerModal()" class="mt-3.5 w-full bg-slate-100 text-slate-700 font-bold py-2 rounded-md text-[11px] active:scale-95 transition">বন্ধ করুন</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        installBtn.addEventListener('click', async () => {
            if (isIos) {
                alert("আইফোনে অ্যাপ ইন্সটল করতে ব্রাউজারের নিচে 'Share' আইকনে ক্লিক করে 'Add to Home Screen' নির্বাচন করুন।");
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            } else {
                alert("ব্রাউজারের মেনু (⋮) থেকে 'Install App' বা 'Add to Home screen' সিলেক্ট করুন।");
            }
        });

        let isExpanded = false;
        function toggleCategories() {
            const extra = document.getElementById('extraCategories');
            const icon = document.getElementById('toggleIcon');
            isExpanded = !isExpanded;
            extra.style.maxHeight = isExpanded ? extra.scrollHeight + "px" : "0";
            extra.style.opacity = isExpanded ? "1" : "0";
            document.getElementById('toggleText').innerText = isExpanded ? 'কম দেখুন' : 'আরও দেখুন';
            icon.style.transform = isExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        const bdDistricts = ["Bagerhat","Bandarban","Barguna","Barisal","Bhola","Bogra","Brahmanbaria","Chandpur","Chittagong","Chuadanga","Comilla","Cox's Bazar","Dhaka","Dinajpur","Faridpur","Feni","Gaibandha","Gazipur","Gopalganj","Habiganj","Jamalpur","Jessore","Jhalokati","Jhenaidah","Joypurhat","Khagrachari","Khulna","Kishoreganj","Kurigram","Kushtia","Lakshmipur","Lalmonirhat","Madaripur","Magura","Manikganj","Meherpur","Moulvibazar","Munshiganj","Mymensingh","Naogaon","Narail","Narayanganj","Narsingdi","Natore","Nawabganj","Netrokona","Nilphamari","Noakhali","Pabna","Panchagarh","Patuakhali","Pirojpur","Rajbari","Rajshahi","Rangamati","Rangpur","Satkhira","Shariatpur","Sherpur","Sirajganj","Sunamganj","Sylhet","Tangail","Thakurgaon"];
        let currentCity = localStorage.getItem('userCity') || "Dhaka";
        
        function initLocation() {
            document.getElementById('selectedLocText').innerText = currentCity;
            const locList = document.getElementById('locList');
            locList.innerHTML = bdDistricts.map(city => `<li onclick="selectCity('${city}')" class="text-[11px] font-medium text-slate-700 py-1.5 px-2.5 border-b border-slate-50 active:bg-slate-100 cursor-pointer">${city}</li>`).join('');
        }

        function selectCity(city) {
            currentCity = city;
            localStorage.setItem('userCity', city); 
            document.getElementById('selectedLocText').innerText = city;
            document.getElementById('locDropdown').classList.add('hidden');
            fetchPrayerTimes(city);
        }

        function toggleLocDropdown(e) {
            e.stopPropagation();
            const dd = document.getElementById('locDropdown');
            dd.classList.toggle('hidden');
            if (!dd.classList.contains('hidden')) document.getElementById('locSearch').focus();
        }
        
        function filterLocations() {
            const filter = document.getElementById('locSearch').value.toUpperCase();
            const lis = document.getElementById('locList').getElementsByTagName('li');
            for (let li of lis) li.style.display = li.innerText.toUpperCase().includes(filter) ? "" : "none";
        }

        document.addEventListener('click', (e) => {
            const dd = document.getElementById('locDropdown');
            if (dd && !dd.contains(e.target) && e.target.id !== 'locBtn') dd.classList.add('hidden');
        });

        let notiActive = localStorage.getItem('amarDeenBell') === 'true';
        let notifiedPrayers = new Set();
        
        function updateNotiUI() {
            const icon = document.getElementById('notiIcon');
            const txt = document.getElementById('notiText');
            if (notiActive) {
                icon.className = 'fa-solid fa-bell text-[9px] text-yellow-300 drop-shadow-sm';
                txt.classList.add('text-yellow-100');
            } else {
                icon.className = 'fa-regular fa-bell text-[9px] text-white/70';
                txt.classList.remove('text-yellow-100');
            }
        }

        async function toggleNoti() {
            if (!notiActive) {
                if (!("Notification" in window)) return alert("আপনার ব্রাউজার নোটিফিকেশন সাপোর্ট করে না।");
                const perm = await Notification.requestPermission();
                if (perm === "granted") notiActive = true;
                else return alert("অ্যালার্ম পেতে ব্রাউজারের সেটিংস থেকে পারমিশন দিন।");
            } else notiActive = false;
            
            localStorage.setItem('amarDeenBell', notiActive);
            updateNotiUI();
        }

        let prayerTimesData = {};
        let countdownInterval;
        const bnPrayerNames = { 'Fajr': 'ফজর', 'Sunrise': 'সূর্যোদয়', 'Dhuhr': 'যোহর', 'Asr': 'আসর', 'Maghrib': 'মাগরিব', 'Isha': 'এশা' };

        async function fetchPrayerTimes(city = currentCity) {
            const dateStr = new Date().toLocaleDateString('en-GB');
            const cacheKey = `p_${city}_${dateStr}`;
            const cachedData = localStorage.getItem(cacheKey);
            
            if (cachedData) { 
                prayerTimesData = JSON.parse(cachedData); 
                startCalculation(); 
                return; 
            }

            try {
                const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=Bangladesh&method=1`);
                const data = await res.json();
                if (data.code === 200) {
                    prayerTimesData = data.data.timings;
                    localStorage.setItem(cacheKey, JSON.stringify(prayerTimesData));
                    startCalculation();
                }
            } catch (e) {
                document.getElementById('modalPrayerList').innerHTML = `<div class="text-center text-red-500 text-[11px] py-2">ইন্টারনেট সংযোগ চেক করুন!</div>`;
            }
        }

        function format12Hour(timeStr) {
            if (!timeStr) return "--:--";
            let clean = timeStr.split(' ')[0];
            let [h, m] = clean.split(':'); 
            h = parseInt(h, 10);
            let ampm = h >= 12 ? 'PM' : 'AM'; 
            h = h % 12 || 12; 
            return `${h < 10 ? '0' + h : h}:${m} ${ampm}`;
        }

        function updatePrayerTick() {
            if (!prayerTimesData || !prayerTimesData.Fajr) return;
            const now = new Date();
            let nextPrayer = 'Fajr', timeStrForUI = prayerTimesData['Fajr'], nextTime = null;
            const times = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];

            for (let pt of times) {
                if (!prayerTimesData[pt]) continue;
                let clean = prayerTimesData[pt].split(' ')[0];
                let [h, m] = clean.split(':');
                let pTime = new Date(); 
                pTime.setHours(parseInt(h, 10), parseInt(m, 10), 0, 0);
                if (pTime > now) { 
                    nextPrayer = pt; 
                    nextTime = pTime; 
                    timeStrForUI = clean; 
                    break; 
                }
            }
            
            if (!nextTime) {
                let clean = prayerTimesData['Fajr'].split(' ')[0];
                let [h, m] = clean.split(':');
                nextTime = new Date(); 
                nextTime.setDate(now.getDate() + 1); 
                nextTime.setHours(parseInt(h, 10), parseInt(m, 10), 0, 0);
                timeStrForUI = clean;
            }

            document.getElementById('nextPrayerName').innerText = bnPrayerNames[nextPrayer] || '--';
            document.getElementById('nextPrayerTime').innerText = `(${format12Hour(timeStrForUI)})`;
            
            let diff = Math.max(0, nextTime - now);
            let hL = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let mL = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            let sL = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('countdown').innerText = `${hL.toString().padStart(2, '0')}:${mL.toString().padStart(2, '0')}:${sL.toString().padStart(2, '0')}`;

            if (notiActive && diff > 0 && diff <= 1000 && !notifiedPrayers.has(nextPrayer) && nextPrayer !== 'Sunrise') {
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("নামাজের সময়", { 
                        body: `${currentCity}-এ ${bnPrayerNames[nextPrayer]} এর ওয়াক্ত শুরু হয়েছে।`,
                        icon: "logo.png"
                    });
                    notifiedPrayers.add(nextPrayer);
                }
            }
            if (now.getHours() === 0 && now.getMinutes() === 0) notifiedPrayers.clear();
        }

        function startCalculation() {
            updateModalData();
            updatePrayerTick();
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(updatePrayerTick, 1000);
        }

        const modal = document.getElementById('prayerModal');
        const modalContent = document.getElementById('prayerModalContent');
        function openPrayerModal() { modal.classList.remove('hidden'); setTimeout(() => { modalContent.classList.remove('scale-95'); }, 10); }
        function closePrayerModal() { modalContent.classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 200); }
        
        function updateModalData() {
            const modalList = document.getElementById('modalPrayerList');
            const mainTimes = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            let html = '';
            mainTimes.forEach(t => {
                if (prayerTimesData[t]) {
                    html += `<div class="flex justify-between items-center ${t === 'Sunrise' ? 'bg-orange-50/50 text-orange-600' : 'bg-slate-50 text-slate-700'} py-2 px-3 rounded-lg border border-slate-100">
                        <span class="text-[12px] font-bold">${bnPrayerNames[t]}</span>
                        <span class="text-[12px] font-mono font-bold">${format12Hour(prayerTimesData[t])}</span>
                    </div>`;
                }
            });
            modalList.innerHTML = html;
        }

        const audioEl = document.getElementById('asmaulAudioPlayer');
        const playIcon = document.getElementById('playerPlayIcon');
        const progressBar = document.getElementById('playerProgressBar');

        function togglePlayerAudio() {
            if (audioEl.paused) {
                audioEl.play().then(() => {
                    playIcon.className = 'fa-solid fa-pause text-[12px]';
                }).catch(() => {});
            } else {
                audioEl.pause();
                playIcon.className = 'fa-solid fa-play text-[12px] ml-0.5';
            }
        }

        function skipPlayerAudio(seconds) {
            if (audioEl.duration) audioEl.currentTime += seconds;
        }

        audioEl.addEventListener('timeupdate', () => {
            if (!audioEl.duration) return;
            const progress = (audioEl.currentTime / audioEl.duration) * 100;
            progressBar.style.width = (progress || 0) + '%';
        });

        audioEl.addEventListener('ended', () => {
            playIcon.className = 'fa-solid fa-play text-[12px] ml-0.5';
            progressBar.style.width = '0%';
            audioEl.currentTime = 0;
        });

        // --- PURE DYNAMIC APP CONFIGURATION ---
        function renderConfig(config) {
            if (!config) return;

            if (config.appName) {
                document.getElementById('appNameHeader').textContent = config.appName;
                document.getElementById('appTitle').textContent = config.appName;
            }

            const playerSection = document.getElementById('audioPlayerSection');
            if (config.audioPlayer && config.audioPlayer.active) {
                playerSection.classList.remove('hidden');
                playerSection.classList.add('flex');
                document.getElementById('audioTitle').innerText = config.audioPlayer.title || '';
                document.getElementById('audioSubtitle').innerText = config.audioPlayer.subtitle || '';
                
                const audioIconDiv = document.getElementById('audioIconContainer');
                if (config.audioPlayer.iconUrl) {
                    audioIconDiv.innerHTML = `<img src="${config.audioPlayer.iconUrl}" class="w-5 h-5 object-contain" onerror="this.style.display='none'">`;
                } else {
                    audioIconDiv.innerHTML = `<i class="fa-solid fa-music text-[13px]"></i>`;
                }

                if (config.audioPlayer.audioSrc && audioEl.getAttribute('src') !== config.audioPlayer.audioSrc) {
                    audioEl.src = config.audioPlayer.audioSrc;
                }
                document.getElementById('audioLink').href = config.audioPlayer.link || '#';
            } else {
                playerSection.classList.add('hidden');
                playerSection.classList.remove('flex');
            }

            if (Array.isArray(config.categories)) {
                const activeCategories = config.categories.filter(c => c.active);
                let mainHtml = '';
                let extraHtml = '';

                activeCategories.forEach((cat, index) => {
                    let iconHtml = cat.iconUrl 
                        ? `<img src="${cat.iconUrl}" alt="${cat.name}" class="w-[22px] h-[22px] object-contain" onerror="this.style.display='none'">` 
                        : `<i class="fa-solid fa-link text-slate-400"></i>`;

                    let catHtml = `
                    <a href="${cat.link}" ${cat.onClick ? `onclick="${cat.onClick}"` : ''} class="cat-item flex flex-col items-center gap-1">
                        <div class="icon-box">${iconHtml}</div>
                        <span class="text-[10px] font-medium text-slate-600 text-center leading-tight">${cat.name}</span>
                    </a>`;
                    
                    if (index < 8) {
                        mainHtml += catHtml; 
                    } else {
                        extraHtml += catHtml; 
                    }
                });

                document.getElementById('mainCategoriesGrid').innerHTML = mainHtml;
                document.getElementById('extraCategoriesGrid').innerHTML = extraHtml;
                
                const toggleBtn = document.getElementById('toggleButtonContainer');
                if (extraHtml === '') {
                    toggleBtn.classList.add('hidden');
                    toggleBtn.classList.remove('flex');
                } else {
                    toggleBtn.classList.remove('hidden');
                    toggleBtn.classList.add('flex');
                }
            }
        }

        async function loadAppConfig() {
            const cached = localStorage.getItem('dynamic_app_config');
            if (cached) {
                try { renderConfig(JSON.parse(cached)); } catch (e) {}
            }
            try {
                const response = await fetch('app-config.json', { cache: 'no-store' });
                if (!response.ok) return;
                const config = await response.json();
                localStorage.setItem('dynamic_app_config', JSON.stringify(config));
                renderConfig(config);
            } catch (error) {}
        }

        // --- PURE DYNAMIC FEED SYSTEM ---
        function renderFeed(data) {
            if (!Array.isArray(data)) return;
            const feedContainer = document.getElementById('dynamicFeed');
            const footerContainer = document.getElementById('minimalFooter');
            
            let feedHtml = '';
            let footerHtml = '';

            data.forEach(item => {
                if (item.type === 'INSTRUCTION' || !item.active) return;
                
                if (item.type === 'footer-links') {
                    footerHtml = `
                        <a href="${item.nameUrl}" target="_blank" class=" underline underline-offset-2">${item.nameText}</a>
                        <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                        <a href="${item.sourceUrl}" target="_blank" class="underline underline-offset-2">${item.sourceText}</a>
                    `;
                    return; 
                }

                feedHtml += `<div class="w-full">`;

                if (item.type === 'notice') {
                    feedHtml += `
                    <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 relative overflow-hidden flex flex-col justify-center shadow-sm">
                        <div class="flex items-start gap-2.5 relative z-10">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex justify-center items-center shrink-0 mt-0.5">
                                <i class="fa-solid ${item.icon || 'fa-bullhorn'} text-[13px]"></i>
                            </div>
                            <div>
                                <h3 class="text-[12px] font-bold text-blue-900 mb-0.5">${item.title}</h3>
                                <p class="text-[10.5px] text-blue-700 leading-snug">${item.description}</p>
                            </div>
                        </div>
                    </div>`;
                }
                else if (item.type === 'hadith') {
                    feedHtml += `
                    <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 shadow-sm flex flex-col">
                        <h3 class="text-[11.5px] font-bold text-indigo-800 mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-book-open text-[11px]"></i> ${item.title}</h3>
                        <p class="text-[12.5px] font-medium text-slate-800 leading-snug mb-2">"${item.text}"</p>
                        <p class="text-[9.5px] text-slate-500 font-semibold text-right">- ${item.reference}</p>
                    </div>`;
                }
                else if (item.type === 'dua') {
                    feedHtml += `
                    <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 shadow-sm flex flex-col">
                        <h3 class="text-[11.5px] font-bold text-emerald-800 mb-1.5 flex items-center gap-1.5"><i class="fa-solid fa-hands-praying text-[10px]"></i> ${item.title}</h3>
                        <p class="text-[15px] font-medium text-slate-800 text-right leading-relaxed mb-2" dir="rtl">${item.arabic}</p>
                        <p class="text-[10.5px] text-slate-600 leading-snug italic">" ${item.meaning} "</p>
                    </div>`;
                } 
                else if (item.type === 'video') {
                    feedHtml += `
                    <div class="bg-white border border-slate-100 rounded-xl shadow-sm overflow-hidden flex flex-col">
                        <div class="px-3 py-2 border-b border-slate-50 flex items-center gap-2">
                            <i class="fa-brands fa-youtube text-red-500 text-[12px]"></i>
                            <h3 class="text-[11.5px] font-bold text-slate-800">${item.title}</h3>
                        </div>
                        <div class="relative w-full bg-slate-100" style="padding-top: 56.25%;">
                            <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${item.youtubeId}?rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>`;
                }
                else if (item.type === 'playlist') {
                    feedHtml += `
                    <div class="bg-white border border-slate-100 rounded-xl shadow-sm overflow-hidden flex flex-col">
                        <div class="px-3 py-2 border-b border-slate-50 flex items-center gap-2">
                            <i class="fa-solid fa-list text-red-500 text-[12px]"></i>
                            <h3 class="text-[11.5px] font-bold text-slate-800">${item.title}</h3>
                        </div>
                        <div class="relative w-full bg-slate-100" style="padding-top: 56.25%;">
                            <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/videoseries?list=${item.youtubeId}&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    </div>`;
                }
                else if (item.type === 'video-grid') {
                    let gridHtml = '';
                    item.videos.forEach(vid => {
                        gridHtml += `
                        <div class="bg-white border border-slate-100 rounded-xl shadow-sm overflow-hidden flex flex-col">
                            <div class="px-2 py-1.5 border-b border-slate-50 flex items-center gap-1.5">
                                <i class="fa-brands fa-youtube text-red-500 text-[10px]"></i>
                                <h3 class="text-[9.5px] font-bold text-slate-800 truncate">${vid.title}</h3>
                            </div>
                            <div class="relative w-full bg-slate-100" style="padding-top: 56.25%;">
                                <iframe class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/${vid.youtubeId}?rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            </div>
                        </div>`;
                    });
                    feedHtml += `<div class="grid grid-cols-2 gap-2 w-full">${gridHtml}</div>`;
                }
                else if (item.type === 'image-grid') {
                    let gridHtml = '';
                    item.images.forEach(img => {
                        gridHtml += `
                        <a href="${img.link || '#'}" target="_blank" class="block bg-white border border-slate-100 rounded-xl shadow-sm overflow-hidden relative aspect-video">
                            <img src="${img.imageUrl}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                            ${img.title ? `<div class="absolute bottom-0 left-0 w-full bg-black/60 text-white text-[9.5px] font-semibold px-2 py-1.5 truncate backdrop-blur-sm">${img.title}</div>` : ''}
                        </a>`;
                    });
                    feedHtml += `<div class="grid grid-cols-2 gap-2 w-full">${gridHtml}</div>`;
                }
                else if (item.type === 'ramadan') {
                    feedHtml += `
                    <div class="bg-gradient-to-r from-orange-50 to-amber-50 border border-orange-100 rounded-xl p-3 shadow-sm flex flex-col justify-center">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-[11.5px] font-bold text-orange-800 flex items-center gap-1.5"><i class="fa-solid fa-moon text-[11px]"></i> আজকের রোজা (${item.date})</h3>
                        </div>
                        <div class="flex gap-2">
                            <div class="flex-1 bg-white/60 rounded-lg p-2 text-center border border-orange-50">
                                <span class="block text-[9px] text-slate-500 font-medium mb-0.5">সাহরী শেষ</span>
                                <span class="block text-[13px] font-bold text-slate-800 font-mono">${item.sehri}</span>
                            </div>
                            <div class="flex-1 bg-white/60 rounded-lg p-2 text-center border border-orange-50">
                                <span class="block text-[9px] text-slate-500 font-medium mb-0.5">ইফতার শুরু</span>
                                <span class="block text-[13px] font-bold text-slate-800 font-mono">${item.iftar}</span>
                            </div>
                        </div>
                    </div>`;
                }
                else if (item.type === 'image') {
                    feedHtml += `
                    <a href="${item.link || '#'}" target="_blank" class="block bg-white border border-slate-100 rounded-xl shadow-sm overflow-hidden relative aspect-video">
                        <img src="${item.imageUrl}" alt="${item.title || 'Image'}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                        ${item.title ? `<div class="absolute bottom-0 left-0 w-full bg-black/60 text-white text-[11.5px] font-semibold px-3 py-2 truncate backdrop-blur-sm">${item.title}</div>` : ''}
                    </a>`;
                }
                else if (item.type === 'quote') {
                    feedHtml += `
                    <div class="bg-slate-50 border border-slate-150 rounded-xl p-3.5 shadow-sm text-center flex flex-col justify-center items-center">
                        <i class="fa-solid fa-quote-left text-[14px] text-slate-300 mb-1"></i>
                        <p class="text-[12px] font-medium text-slate-700 leading-snug mb-1">"${item.text}"</p>
                        <p class="text-[9.5px] text-slate-500 font-semibold">- ${item.author}</p>
                    </div>`;
                }
                
                feedHtml += `</div>`;
            });
            
            feedContainer.innerHTML = feedHtml;
            if (footerHtml !== '') {
                footerContainer.innerHTML = footerHtml;
            }
        }

        async function loadDynamicFeed() {
            const cached = localStorage.getItem('dynamic_app_feed');
            if (cached) {
                try { renderFeed(JSON.parse(cached)); } catch (e) {}
            }
            try {
                const response = await fetch('content.json', { cache: 'no-store' });
                if (!response.ok) return; 
                const data = await response.json();
                localStorage.setItem('dynamic_app_feed', JSON.stringify(data));
                renderFeed(data);
            } catch (error) {}
        }

        initLocation(); 
        updateNotiUI(); 
        loadAppConfig(); 
        loadDynamicFeed(); 
        fetchPrayerTimes();
    </script>
</body>
</html>
